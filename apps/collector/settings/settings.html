<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>SpaceLog 설정</title>
<link rel="stylesheet" href="dropzone.css">
<style>
  html, body, #root { overflow: auto; user-select: auto; }
  .settings { padding: 16px 20px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 13px; margin: 0 0 6px; color: var(--mute); }
  section { padding: 12px 0; border-top: 1px solid rgb(122 108 255 / .4); display: flex; flex-direction: column; gap: 6px; }
  button { border: 2px solid var(--ink); border-radius: 8px; padding: 4px 10px; background: var(--panel-2); color: var(--ink); font-weight: 600; cursor: pointer; }
  .shortcut { align-self: flex-start; font-family: "IBM Plex Mono", ui-monospace, monospace; background: var(--yellow); }
  .shortcut.is-capturing { background: var(--sky); }
  .check { display: flex; gap: 8px; align-items: center; }
  .row { display: flex; gap: 6px; }
  .path { margin: 0; font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; user-select: text; }
  .hint { margin: 0; font-size: 11px; color: var(--mute); }
  .warn { margin: 0; font-size: 12px; color: var(--yellow); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 4px 0 0; font-size: 12px; }
  dt { color: var(--mute); } dd { margin: 0; }
  .msg { margin: 8px 0 0; padding: 6px 8px; border-radius: 8px; background: rgb(94 200 255 / .15); font-size: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="settings.js"></script>
</body>
</html>
