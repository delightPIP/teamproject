# Render에 올리는 것은 "받는 곳" 한 페이지뿐이다.
# 수집 앱과 로컬 웹은 사용자의 PC에서만 돈다 (POLICY 1-1·1-3).
# 기록·보관함·로컬 서버는 어디에도 올라가지 않는다.
services:
  - type: web
    name: spacelog-download
    runtime: static
    rootDir: site
    buildCommand: ""        # 빌드 도구 없음. 정적 파일 그대로 올린다
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
