<title>spaceLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: full-screen WebGL space + chunky "arcade" HUD cards with thick ink outlines and drop-step shadows */
:root{
  --ink:#1a1430; --space:#15103a; --panel:#f4f2ff; --panel2:#e6e2ff;
  --yellow:#ffd23f; --pink:#ff5d8f; --violet:#7a6cff; --mute:#5b5480; --sky:#5ec8ff;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--space);color:var(--panel);font-family:var(--f-body)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.card{background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.btn{font-family:var(--f-display);font-size:15px;letter-spacing:.02em;border:3px solid var(--ink);border-radius:12px;background:var(--yellow);color:var(--ink);padding:8px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.dock button:focus-visible,.rec:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn.pink{background:var(--pink);color:#fff}
.btn.violet{background:var(--violet);color:#fff}
.btn.ghost{background:var(--panel2)}

/* top-left brand */
#brand{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));padding:12px 16px;display:flex;flex-direction:column;gap:6px;max-width:min(300px,calc(100vw - 28px))}
#brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;letter-spacing:.01em}
#brand h1 span{color:var(--violet)}
#brand p{margin:0;font-size:12.5px;color:var(--mute);line-height:1.45}
#brand .stats{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700}
#brand .stats b{background:var(--ink);color:var(--yellow);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
#brand .btn{font-size:13px;padding:6px 10px;align-self:flex-start;margin-top:2px}

/* help */
#help{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));padding:8px 12px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:420px;justify-content:flex-end}
#help kbd{font-family:var(--f-mono);font-size:11px;background:var(--ink);color:var(--panel);border-radius:5px;padding:1px 6px;margin-right:3px}

/* dock */
#dock{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#dock .label{font-family:var(--f-display);font-size:13px;color:var(--yellow);text-shadow:0 2px 0 var(--ink);letter-spacing:.04em}
.dock button{display:flex;align-items:center;gap:10px;font:600 14px var(--f-body);color:var(--ink);background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:7px 12px 7px 8px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:left;min-width:170px;white-space:nowrap}
.dock button .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);flex:none}
.dock button .n{margin-left:auto;font-family:var(--f-display);font-size:13px;background:var(--ink);color:var(--yellow);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.dock button.here{background:var(--yellow)}


/* near prompt */
#near{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));font-size:16px}
#near kbd{font-family:var(--f-mono);background:var(--ink);color:var(--yellow);border-radius:6px;padding:1px 7px;margin-right:6px}

/* panel */
#panel{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 28px));display:flex;flex-direction:column;overflow:hidden;animation:pop .22s cubic-bezier(.3,1.5,.6,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
#panel header{padding:16px 16px 12px;display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--ink)}
#panel .planet-ico{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);flex:none;box-shadow:inset -8px -8px 0 rgba(0,0,0,.18)}
#panel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.05}
#panel .sub{font-size:12.5px;color:var(--mute);margin-top:3px}
#panel .x{margin-left:auto;align-self:flex-start;width:34px;height:34px;padding:0;font-size:18px;background:var(--panel2)}
#panel .body{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
#panel .eyebrow{font-family:var(--f-display);font-size:12px;color:var(--violet);letter-spacing:.06em}
.recs{display:flex;flex-direction:column;gap:7px}
.rec{display:flex;gap:10px;align-items:center;text-align:left;font:600 14px var(--f-body);color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;cursor:pointer}
.rec .s{color:#e0a800;font-size:16px;flex:none;-webkit-text-stroke:1px var(--ink)}
.rec .d{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.rec .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec.on{background:var(--yellow)}
.rec.new{animation:flash 1.2s}
@keyframes flash{0%,40%{background:var(--pink);color:#fff}}
.detail{background:var(--panel2);border:2.5px dashed var(--ink);border-radius:12px;padding:12px;font-size:14px;line-height:1.6}
.detail h3{margin:0 0 4px;font-size:15px}
.detail .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.detail .tags span{font:600 11.5px var(--f-mono);background:var(--ink);color:var(--panel);border-radius:6px;padding:1px 7px}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0;border:2.5px solid var(--ink);border-radius:10px;padding:8px 10px;font:500 14px var(--f-body);background:#fff;color:var(--ink)}
#panel footer{padding:12px 16px 16px;border-top:3px solid var(--ink);display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
#panel footer .row{display:flex;gap:8px}
#panel footer .row .btn{flex:1}
#panel footer small{color:var(--mute);font-size:11.5px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,6,30,.6);display:grid;place-items:center;padding:16px}
#modal .card{width:min(640px,100%);max-height:min(80vh,720px);display:flex;flex-direction:column;overflow:hidden}
#modal .top{padding:14px 16px;display:flex;gap:10px;align-items:center;border-bottom:3px solid var(--ink);flex-wrap:wrap}
#modal h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{font:700 13px var(--f-body);border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px;background:#fff;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--yellow)}
#modal pre{margin:0;padding:16px;overflow:auto;flex:1;font:13px/1.6 var(--f-mono);background:#fff;color:var(--ink);white-space:pre-wrap;word-break:break-word;min-height:0}
#modal .bot{padding:12px 16px;display:flex;gap:8px;align-items:center;border-top:3px solid var(--ink);background:var(--panel2);flex-wrap:wrap}
#modal .bot small{color:var(--mute);font-size:12px;flex:1;min-width:180px}

#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 16px;font-weight:700;font-size:14px;background:var(--yellow);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis}

/* layers */
#stage{z-index:1}
#brand,#help,#dock,#near,#panel{z-index:2}
#modal{z-index:40}
#toast{z-index:50}
#brand .brow{display:flex;gap:6px;flex-wrap:wrap}

/* W-00 home */
#home{position:fixed;inset:0;z-index:20;overflow-y:auto;overflow-x:hidden;background:radial-gradient(ellipse at 50% 28%,#2c2070 0%,var(--space) 62%);color:var(--panel)}
.home-stars{position:absolute;inset:0;pointer-events:none}
.hstar{position:absolute;border-radius:50%;opacity:.85}
.home-wrap{position:relative;max-width:1040px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.home-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.home-top .logo{font-family:var(--f-display);font-size:24px;padding:8px 14px;line-height:1}
.home-top .logo span{color:var(--violet)}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hero h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1.15;text-shadow:0 3px 0 var(--ink);text-wrap:balance}
.hero h2 em{font-style:normal;color:var(--yellow)}
.hstats{display:flex;gap:8px;font-weight:700;font-size:13px;align-items:center}
.hstats b{background:var(--ink);color:var(--yellow);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums;border:2px solid #3a2f6a}
.bh-wrap{position:relative;width:300px;height:300px;max-width:80vw;max-height:80vw;display:grid;place-items:center;margin:-8px 0}
#bhCanvas{position:absolute;inset:0;width:100%;height:100%}
#enterBtn{position:relative;font-size:18px;padding:12px 20px;box-shadow:0 5px 0 var(--ink)}
.hero .hint{margin:0;font-size:13px;color:#b9b3e6}
.home-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hcard{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hcard .eyebrow{font-family:var(--f-display);font-size:12px;color:var(--violet);letter-spacing:.06em}
.hcard h3{margin:0;font-size:16px;line-height:1.35}
.hcard p{margin:0;font-size:13.5px;line-height:1.6;color:var(--mute)}
.hcard .btn{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:14px}
.hlist{display:flex;flex-direction:column;gap:7px}
.pdot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);flex:none}
.rec .n2{margin-left:auto;font-family:var(--f-display);font-size:12px;background:var(--ink);color:var(--yellow);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}

/* transition veil */
#veil{position:fixed;inset:0;background:var(--ink);z-index:30;display:grid;place-items:center}
#veil .ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--yellow),var(--pink),var(--violet),var(--yellow));-webkit-mask:radial-gradient(circle,transparent 16px,#000 17px);mask:radial-gradient(circle,transparent 16px,#000 17px);animation:spin .8s linear infinite;opacity:0;transition:opacity .2s}
#veil.waiting .ring{opacity:1}
@keyframes spin{to{transform:rotate(1turn)}}

/* W-01 additions */
.badge{font-family:var(--f-display);font-size:12px;background:var(--ink);color:var(--yellow);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums;min-width:22px;text-align:center;display:inline-block}
#hProbe,#probeBtn{display:flex;align-items:center;gap:8px}
#period{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:5px;display:flex;gap:6px;align-items:center;z-index:2;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 28px)}
.seg{display:flex;gap:4px}
.seg button{font:700 13px var(--f-body);border:0;border-radius:999px;padding:6px 12px;background:transparent;color:var(--ink);cursor:pointer}
.seg button:hover{background:var(--panel2)}
.seg button.on{background:var(--ink);color:var(--yellow)}
.seg button:focus-visible{outline:3px solid var(--sky);outline-offset:1px}
.range{display:flex;gap:4px;align-items:center;font-size:12px;padding-right:4px}
.range input{font:500 12px var(--f-mono);border:2px solid var(--ink);border-radius:8px;padding:3px 5px;background:#fff;color:var(--ink)}
#help .ht{display:none;font-family:var(--f-display);font-weight:400;font-size:14px}
#help .keys{display:flex;gap:10px;flex-wrap:wrap}
#help.big{flex-direction:column;align-items:flex-start;padding:12px 14px;font-size:13px;gap:8px}
#help.big .ht{display:block}
#help.big .keys{display:grid;grid-template-columns:repeat(2,auto);gap:6px 16px}
#probeBtn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2;font-size:16px;padding:10px 16px}
#probeBtn.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.12)}}
#redis{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;width:max-content;max-width:min(520px,calc(100vw - 440px))}
#redis .tx{min-width:0;display:flex;flex-direction:column}
#redis .eyebrow{font-family:var(--f-display);font-size:11.5px;color:var(--violet);letter-spacing:.05em}
#redis b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#redis .btn{font-size:13px;padding:6px 10px;flex:none}
#worldMsg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;padding:20px 22px;width:min(380px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center;box-sizing:border-box}
#worldMsg h3{margin:0;font-size:16px;line-height:1.5}
#worldMsg .eyebrow,#hState .eyebrow{font-family:var(--f-display);font-size:12px;color:var(--violet);letter-spacing:.06em}
#hState{max-width:460px;width:100%;margin:24px auto 0;align-items:center;text-align:center;padding:24px;box-sizing:border-box}
#hState h3{font-size:17px;line-height:1.5}
#demo{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:6px;align-items:center;padding:4px 6px 4px 10px;font:700 11.5px var(--f-body);border-style:dashed;box-shadow:none}
#demo select{font:600 12px var(--f-body);border:2px solid var(--ink);border-radius:8px;padding:3px 4px;background:#fff;color:var(--ink)}
.btn:disabled{background:var(--panel2);color:var(--mute);box-shadow:none;cursor:not-allowed;transform:none}

/* W-02 / W-03 */
#panel .hd{min-width:0;flex:1}
#panel .x{margin-left:0;flex:none}
#panel h2.h2s{font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.ic{border:0;background:transparent;font-size:15px;cursor:pointer;color:var(--mute);padding:2px 5px;border-radius:6px;vertical-align:3px}
.ic:hover{background:var(--panel2);color:var(--ink)}
.ic:focus-visible{outline:3px solid var(--sky)}
#pRenameIn{font:400 20px var(--f-display);width:100%;box-sizing:border-box;border:2.5px solid var(--ink);border-radius:10px;padding:3px 8px;background:#fff;color:var(--ink)}
.menu{display:flex;flex-direction:column;border-bottom:3px solid var(--ink);background:var(--panel2)}
.menu button{font:600 14px var(--f-body);text-align:left;padding:10px 16px;border:0;border-top:1.5px dashed #b7b0e0;background:transparent;color:var(--ink);cursor:pointer}
.menu button:first-child{border-top:0}
.menu button:hover:not(:disabled){background:var(--yellow)}
.menu button:disabled{color:#9a94bd;cursor:not-allowed}
.lbl{font-family:var(--f-display);font-size:12px;color:var(--violet);letter-spacing:.06em}
.rec.row{padding:4px 6px 4px 10px;gap:8px;cursor:default}
.rec.row input{width:18px;height:18px;accent-color:var(--violet);flex:none;margin:0;cursor:pointer}
.recb{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;font:inherit;color:inherit;text-align:left;padding:4px 2px;cursor:pointer;border-radius:8px}
.recb:focus-visible{outline:3px solid var(--sky)}
.th{width:34px;height:34px;flex:none;border:2.5px solid var(--ink);border-radius:8px;background:var(--panel2);display:grid;place-items:center;font:700 9.5px var(--f-mono);color:var(--ink);overflow:hidden;box-sizing:border-box}
.empty{border:2.5px dashed #b7b0e0;border-radius:12px;padding:18px;text-align:center;color:var(--mute);font-size:13.5px;line-height:1.6}
#panel footer .btn{width:100%}
.pv{border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;flex:none}
.pv.img{aspect-ratio:4/3;max-width:100%;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box}
.pv.img span{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:1px 6px;font:600 12px var(--f-mono)}
.pv.file{display:flex;gap:12px;align-items:center;padding:14px;background:#fff}
.pv.file .fi{width:52px;height:62px;border:2.5px solid var(--ink);border-radius:8px 18px 8px 8px;background:var(--yellow);display:grid;place-items:center;font:700 12px var(--f-mono);flex:none}
.pv.file b,.pv.link b{display:block;font-size:14px;overflow-wrap:anywhere}
.pv small{font:500 12px var(--f-mono);color:var(--mute);overflow-wrap:anywhere}
.pv.link{padding:14px;background:#fff;display:flex;flex-direction:column;gap:4px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.meta dt{color:var(--mute)}
.meta dd{margin:0;font-weight:600}
.meta dd.mono{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
#memo{width:100%;box-sizing:border-box;border:2.5px solid var(--ink);border-radius:10px;padding:8px 10px;font:500 14px/1.55 var(--f-body);resize:vertical;background:#fff;color:var(--ink);margin-top:-6px}
#memo:focus-visible,.mv select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.st{font-size:11.5px;color:var(--mute);margin-top:-8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{font-size:13px;padding:6px 10px}
.mv{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
.mv select{flex:1;min-width:0;font:600 13px var(--f-body);border:2.5px solid var(--ink);border-radius:10px;padding:6px 8px;background:#fff;color:var(--ink)}
.linkdel{align-self:flex-start;border:0;background:transparent;color:#c2185b;font:700 13px var(--f-body);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

/* W-04 */
.cargo{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:3px solid var(--ink);max-height:132px;overflow:auto;background:var(--panel2)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--f-body);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 4px 3px 8px;max-width:100%;color:var(--ink);box-sizing:border-box}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.chip button{border:0;background:var(--panel2);border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px;color:var(--ink);flex:none;padding:0}
.chip.add{cursor:pointer;background:var(--yellow);padding:3px 10px;font-weight:700}
.chip .pdot{width:12px;height:12px;border-width:2px}
.privacy{margin:0;padding:8px 16px;font-size:12.5px;font-weight:600;background:#fff4c2;color:var(--ink);border-top:2px dashed var(--ink)}
#modal .bot .sp{flex:1}

/* merged from the other design doc */
body{word-break:keep-all}
.card{color-scheme:light}
.btn,kbd,.seg button,.tabs button{white-space:nowrap}
.i{flex:none;vertical-align:-3px}
.btn.x{display:grid;place-items:center;position:relative}
.btn.x::after,.ic::after,.chip button::after{content:"";position:absolute;inset:-6px}
.ic{position:relative;display:inline-grid;place-items:center;width:32px;height:32px;vertical-align:-6px}
.chip button{position:relative;display:grid;place-items:center}
.chip button::after{inset:-12px -6px}
.ck{display:grid;place-items:center;width:34px;height:44px;margin:-4px 0 -4px -8px;cursor:pointer;flex:none}
.th{color:var(--ink)}
.na{color:#8a84ad}
#panel{--accent:var(--violet)}

/* ---------- SPACE BACKDROP ---------- */
(()=>{

  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));

  const blob=(c1)=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');

function pick(e){
  const m=new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(m,camera);
  const live=[...starMeshes.filter(s=>s.visible),...bodies.filter(b=>b.parent.parent.visible)];

  if(!best)PLANETS.forEach(P=>P.records.forEach(r=>{const k=dayDiff(r.d,td);if(!best||k>best.days)best={P,r,days:k};}));
  return best;
}

function line(r){
  const head=`### ${r.t} · ${r.d}`, memo=r.memo&&r.type==='text'?`\n메모: ${r.memo}`:'';
  if(r.type==='link')return `${head}\n[링크] ${r.lt}\n${r.url}\n${r.memo}`;

  if(r.type==='file')return `${head}\n[파일] ${r.fname} · ${r.size||'크기 미확인'}\n${r.memo}`;
  return `${head}\n${r.b}${memo}`;
}
function buildClaude(rs){
  const g=group(rs);

  g.forEach((list,P)=>{s+=`\n## 행성: ${P.name} (${P.sub})\n\n`+list.map(line).join('\n\n')+'\n';});
  return s+`\n---\n요청: 이 기록들에서 반복되는 주제 3개와, 다음에 해볼 행동 하나를 제안해줘.`;

/* ---------- LOOP ---------- */
const vel=new V3(), clock=new THREE.Clock(); let nearP=null, t=0;
const camTarget=new V3(), tmp=new V3();
function step(){
  const dt=Math.min(clock.getDelta(),.05);
  if(!inWorld){requestAnimationFrame(step);return;}
  t+=dt;
  // input
  const f=new V3(-Math.sin(camYaw),0,-Math.cos(camYaw)), r=new V3(Math.cos(camYaw),0,-Math.sin(camYaw));
  const inp=new V3();
  if(keys.KeyW||keys.ArrowUp)inp.add(f); if(keys.KeyS||keys.ArrowDown)inp.sub(f);
  if(keys.KeyD||keys.ArrowRight)inp.add(r); if(keys.KeyA||keys.ArrowLeft)inp.sub(r);
  if(keys.Space)inp.y+=1; if(keys.ShiftLeft||keys.ShiftRight||keys.KeyC)inp.y-=1;
  const MAX=15;
  if(autopilot){
    const A=autopilot; A.t=Math.min(1,A.t+dt/1.2); const ae=A.t<.5?2*A.t*A.t:1-Math.pow(-2*A.t+2,2)/2;
    tmp.copy(A.from).lerp(A.target,ae); vel.copy(tmp).sub(player.position).divideScalar(Math.max(dt,1e-3));
    if(A.t>=1){autopilot=null;setTimeout(()=>{vel.set(0,0,0);if(inWorld&&!autopilot)openPanel(A.P,A.rec);},200);}
    const hy=Math.atan2(vel.x,vel.z)+Math.PI; let dy=hy-camYaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); camYaw+=dy*(1-Math.exp(-1.2*dt));
  }else{
    if(inp.lengthSq())inp.normalize();
    vel.addScaledVector(inp,32*dt); vel.multiplyScalar(Math.exp(-2.4*dt)); if(vel.length()>MAX)vel.setLength(MAX);
  }
  player.position.addScaledVector(vel,dt);
  // planet collision + proximity
  let best=null,bd=1e9;
  PLANETS.forEach(P=>{
    P.spin.rotation.y+=dt*.06; P.scale+=(P.targetScale-P.scale)*Math.min(1,dt*3); P.spin.scale.setScalar(P.scale);
    if(P.ring&&P.ring.rotation)P.ring.rotation.z+=dt*.05;
    P.records.forEach(rec=>{rec.holder.rotation.y+=rec.speed*dt; rec.star.rotation.y+=rec.star.userData.spin*dt;});
    tmp.copy(player.position).sub(P.group.position); const d=tmp.length(), minD=P.r*P.scale+1.6;
    if(d<minD){tmp.normalize();player.position.copy(P.group.position).addScaledVector(tmp,minD);const vn=vel.dot(tmp);if(vn<0)vel.addScaledVector(tmp,-vn*1.4);}
    const near=d-(P.r*P.scale); if(near<8&&near<bd){bd=near;best=P;}
  });
  nearP=best;
  PLANETS.forEach(P=>P.dockBtn.classList.toggle('here',P===nearP));
  const nb=$('#near');
  if(nearP&&panelP!==nearP&&!autopilot&&$('#worldMsg').hidden&&nearP.group.visible){nb.hidden=false;const s=`<kbd>E</kbd>'${nearP.name}' 행성 열기`;if(nb.innerHTML!==s)nb.innerHTML=s;}else nb.hidden=true;
  if(panelP&&nearP!==panelP&&!autopilot&&player.position.distanceTo(panelP.group.position)>panelP.r*panelP.scale+14)closePanel();

  // flying stars
  for(let i=flying.length-1;i>=0;i--){const F=flying[i];F.t+=dt/1.5;const e=F.t<.5?2*F.t*F.t:1-Math.pow(-2*F.t+2,2)/2;
    const tgt=F.holder.localToWorld(new V3(F.R,0,0)); const mid=F.from.clone().lerp(tgt,.5).add(new V3(0,7,0));
    const a=F.from.clone().lerp(mid,e), b=mid.clone().lerp(tgt,e); F.star.position.copy(a.lerp(b,e));
    F.star.scale.setScalar(1+Math.sin(F.t*Math.PI)*.8); F.star.rotation.y+=dt*8;
    if(F.t>=1){F.holder.add(F.star);F.star.position.set(F.R,0,0);F.star.scale.setScalar(1);flying.splice(i,1);}}

  // character anim
  const sp=vel.length(), k=Math.min(sp/MAX,1.3);
  if(sp>.5){const ty=Math.atan2(vel.x,vel.z);let dy=ty-yawG.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));yawG.rotation.y+=dy*(1-Math.exp(-8*dt));}
  leanG.rotation.x+=((Math.min(k,1)*.55)-leanG.rotation.x)*(1-Math.exp(-6*dt));
  leanG.position.y=Math.sin(t*2.2)*.14*(1-k*.6);
  leanG.rotation.z=Math.sin(t*1.3)*.05;
  arms[0].rotation.x=-Math.sin(t*2.2)*.25-k*.9; arms[1].rotation.x=Math.sin(t*2.2)*.25-k*.9;
  arms[0].rotation.z=-.25-k*.3; arms[1].rotation.z=.25+k*.3;
  legs[0].rotation.x=Math.sin(t*2.6)*.25+k*.5; legs[1].rotation.x=-Math.sin(t*2.6)*.25+k*.5;
  antBall.position.x=.4+Math.sin(t*5)*.04*(1+k*3);
  const blink=(t%3.4)<.12; eyes.forEach(e=>e.scale.y=blink?.25:1.7);
  flames.forEach((fm,i)=>{fm.scale.set(1,.35+k*1.6+Math.sin(t*40+i)*.12,1);});
  if(k>.25&&Math.random()<k*.9){const p=puffs[puffIdx++%puffs.length];p.life=1;p.m.visible=true;
    p.m.position.copy(flames[Math.random()<.5?0:2].getWorldPosition(tmp)).add(new V3(rand(-.1,.1),-.3,rand(-.1,.1)));}
  puffs.forEach(p=>{if(p.life<=0)return;p.life-=dt*1.8;p.m.material.opacity=Math.max(p.life,0);p.m.scale.setScalar(.6+(1-p.life)*1.4);if(p.life<=0)p.m.visible=false;});

  // camera
  camDist+=(camDistTarget-camDist)*(1-Math.exp(-2.5*dt));
  if(mode==='overview')camTarget.lerp(CENTER,1-Math.exp(-3*dt));
  else camTarget.lerp(tmp.copy(player.position).add(new V3(0,1.3,0)),1-Math.exp(-8*dt));
  const cp=Math.cos(camPitch);
  camera.position.set(camTarget.x+Math.sin(camYaw)*cp*camDist, camTarget.y+Math.sin(camPitch)*camDist, camTarget.z+Math.cos(camYaw)*cp*camDist);
  camera.lookAt(camTarget);
  renderer.render(scene,camera);
  requestAnimationFrame(step);
}
camTarget.copy(player.position);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

let bhSpin=.22,bhRot=0,bhLast=0;
function drawBH(now){
  if(home.hidden){bhLast=0;requestAnimationFrame(drawBH);return;}
  const dt=bhLast?Math.min((now-bhLast)/1000,.05):0;bhLast=now;bhRot+=dt*bhSpin*(reduce?.15:1);
  const w=bhC.clientWidth,dpr=Math.min(devicePixelRatio,2);
  if(bhC.width!==Math.round(w*dpr)){bhC.width=bhC.height=Math.round(w*dpr);}
  const g=bhC.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,w);
  const c=w/2,k=w/300;
  const glow=g.createRadialGradient(c,c,40*k,c,c,150*k);glow.addColorStop(0,'rgba(122,108,255,.55)');glow.addColorStop(1,'rgba(122,108,255,0)');
  g.fillStyle=glow;g.fillRect(0,0,w,w);
  g.lineCap='round';
  const rings=[[128,'#7a6cff',.7,2.2],[108,'#ff5d8f',1,1.7],[88,'#ffd23f',1.5,2.6]];
  rings.forEach(([r,col,sp,len],i)=>{for(let j=0;j<2;j++){const a=bhRot*sp+i*1.3+j*Math.PI;
    g.beginPath();g.arc(c,c,r*k,a,a+len);g.strokeStyle='#1a1430';g.lineWidth=17*k;g.stroke();
    g.beginPath();g.arc(c,c,r*k,a,a+len);g.strokeStyle=col;g.lineWidth=10*k;g.stroke();}});
  for(let i=0;i<16;i++){const ph=((bhRot*.25+i/16)%1),rr=(145-ph*85)*k,a=i*2.4+ph*7+bhRot;
    g.beginPath();g.arc(c+Math.cos(a)*rr,c+Math.sin(a)*rr,(3.2-ph*2)*k,0,6.3);g.fillStyle=i%3?'#fff':'#ffd23f';g.globalAlpha=1-ph*.6;g.fill();g.globalAlpha=1;}
  g.beginPath();g.arc(c,c,66*k,0,6.3);g.fillStyle='#0c0820';g.fill();g.lineWidth=5*k;g.strokeStyle='#1a1430';g.stroke();
  requestAnimationFrame(drawBH);
}
requestAnimationFrame(drawBH);

const wait=(ms,skippable)=>new Promise(res=>{const t0=performance.now();(function f(){if((skippable&&skip)||performance.now()-t0>=ms)res();else requestAnimationFrame(f);})();});
const tween=(ms,fn,ease)=>new Promise(res=>{const t0=performance.now();(function f(){const p=Math.min((performance.now()-t0)/ms,1);fn(ease?ease(p):p);p<1?requestAnimationFrame(f):res();})();});
const outExpo=p=>1-Math.pow(1-p,3.2);
const hole=R=>{veil.style.background=`radial-gradient(circle at 50% 50%, transparent ${R}px, #1a1430 ${R+3}px)`;};
const diag=()=>Math.hypot(innerWidth,innerHeight)/2+30;
addEventListener('pointerdown',()=>{if(busy&&!inWorld)skip=true;},true);

async function enter(P,rec){
  if(busy||inWorld)return; busy=true; skip=false;
  await wait(0);
  veil.style.background='';veil.style.opacity='';veil.style.clipPath='';
  if(reduce){veil.hidden=false;await tween(200,p=>veil.style.opacity=p);}
  else{
    const br=enterBtn.getBoundingClientRect(),cx=br.left+br.width/2,cy=br.top+br.height/2;
    bhSpin=1.6;
    bhC.animate([{transform:'scale(1)'},{transform:'scale(2.5)'}],{duration:300,easing:'ease-in',fill:'forwards'});
    await wait(180,true);
    const els=[...home.querySelectorAll('[data-suck]'),enterBtn].map(el=>{const r=el.getBoundingClientRect();return{el,dx:cx-(r.left+r.width/2),dy:cy-(r.top+r.height/2)};})
      .sort((a,b)=>Math.hypot(a.dx,a.dy)-Math.hypot(b.dx,b.dy));
    els.forEach(({el,dx,dy},i)=>el.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(0) rotate(${i%2?30:-30}deg)`,opacity:0}],
      {duration:520,delay:i*30,easing:'cubic-bezier(.55,0,1,.45)',fill:'forwards'}));
    const st=home.querySelector('.home-stars');st.style.transformOrigin=`${cx}px ${cy+home.scrollTop}px`;
    st.animate([{transform:'none',opacity:1},{transform:'rotate(140deg) scale(0)',opacity:0}],{duration:700,easing:'cubic-bezier(.55,0,1,.45)',fill:'forwards'});
    await wait(560,true);
    veil.hidden=false;
    await tween(skip?120:300,p=>veil.style.clipPath=`circle(${p*p*diag()*2.2}px at ${cx}px ${cy}px)`);
    veil.style.clipPath='';
  }
  // swap behind the veil
  home.hidden=true; bhSpin=.22;
  home.querySelectorAll('*').forEach(el=>el.getAnimations&&el.getAnimations().forEach(a=>a.cancel()));
  worldUI.forEach(el=>el.hidden=false);
  player.position.set(0,0,10); vel.set(0,0,0); mode='overview'; camYaw=0; camPitch=.5; camDist=OV*.8; camDistTarget=OV; camTarget.copy(CENTER);
  autopilot=null; for(const k in keys)keys[k]=false;
  inWorld=true; skip=false; applyPeriod(true);
  veil.classList.add('waiting'); await wait(380); veil.classList.remove('waiting');   // stands in for loading the universe
  if(reduce){await tween(200,p=>veil.style.opacity=1-p);}
  else{const D=diag();await tween(650,p=>hole(p*D),outExpo);}
  veil.hidden=true; veil.style.background=''; veil.style.opacity='';
  busy=false;
  if(P)flyTo(P,rec);
  else toast('WASD로 날아보거나, 왼쪽 행성을 눌러 바로 이동하세요');
}

async function leave(){
  if(busy||!inWorld)return; busy=true; closePanel(); $('#near').hidden=true;
  const D=diag(); veil.style.opacity=''; hole(D); veil.hidden=false;
  await tween(reduce?150:400,p=>hole((1-p)*D),p=>p*p);
  veil.style.background='';
  inWorld=false; autopilot=null; for(const k in keys)keys[k]=false;
  worldUI.forEach(el=>el.hidden=true); $('#near').hidden=true; $('#redis').hidden=true; $('#worldMsg').hidden=true;
  renderHome(); home.hidden=false; home.scrollTop=0;
  await tween(250,p=>veil.style.opacity=1-p);
  veil.hidden=true; veil.style.opacity=''; busy=false;
}
})();
</script>
