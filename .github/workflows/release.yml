# 수집 앱 설치 파일 만들기 (이슈 #57)
# - 태그 v* 푸시 → 윈도우·맥에서 zip을 만들어 GitHub Release "초안"에 붙인다. 공개(Publish)는 사람이 누른다.
# - 수동 실행(workflow_dispatch) → zip만 만들어 Actions 아티팩트로 남긴다 (Release는 안 만든다).
# 맥용은 맥 러너에서 만든다: 윈도우에서 만들면 .app 안의 심볼릭 링크가 깨진다.
# 서명·공증 없음 (인증서 없음, PRD 8장). 받는 곳 페이지의 #막힐때 안내가 이 때문에 있다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest # Apple Silicon 러너
            arch: arm64
          - os: macos-latest # 같은 러너에서 Intel용을 따로 묶는다
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 서버가 node:sqlite를 쓴다 (빌드는 esbuild 번들이지만 웹 빌드·테스트와 맞춘다)

      - name: 의존성 (루트·web 워크스페이스)
        run: npm ci

      - name: 의존성 (수집 앱)
        working-directory: apps/collector
        run: npm ci

      - name: 태그와 앱 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./apps/collector/package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "태그 ${GITHUB_REF_NAME} 와 apps/collector/package.json version $v 가 다릅니다"; exit 1
          fi

      - name: 로컬 웹 빌드
        run: npm run build -w @spacelog/web

      - name: 설치 파일 만들기
        working-directory: apps/collector
        run: npm run package -- --arch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceLog-${{ runner.os }}-${{ matrix.arch }}
          path: apps/collector/out/*.zip
          if-no-files-found: error

  # 세 작업이 동시에 Release를 만들면 초안이 여러 개 생길 수 있어 한 번에 붙인다
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true

      - name: Release 초안에 붙이기
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: zips/*.zip
